name: Mirror upstream images to Docker Hub

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"  # 每 6 小时同步一次（你也可以改成每天一次）

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login Docker Hub (destination)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | skopeo login docker.io \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 如果你提供了 GCP_SA_KEY，就登录 GAR；否则自动跳过
      - name: Login Google Artifact Registry (source)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-sa.json
          cat /tmp/gcp-sa.json | skopeo login us-central1-docker.pkg.dev \
            --username _json_key --password-stdin

      - name: Mirror keep-api:latest
        run: |
          SRC="docker://us-central1-docker.pkg.dev/keephq/keep/keep-api:0.49.0"
          DST="docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/keep-api:0.49.0"
          skopeo copy --all "$SRC" "$DST"

      - name: Mirror keep-ui:latest
        run: |
          SRC="docker://us-central1-docker.pkg.dev/keephq/keep/keep-ui:0.49.0"
          DST="docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/keep-ui:0.49.0"
          skopeo copy --all "$SRC" "$DST"

      - name: Mirror soketi:1.4-16-debian
        run: |
          SRC="docker://quay.io/soketi/soketi:1.4-16-debian"
          DST="docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/soketi:1.4-16-debian"
          skopeo copy --all "$SRC" "$DST"
